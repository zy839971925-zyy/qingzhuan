plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
def productionSigningReady = ['QINGZHUAN_RELEASE_KEYSTORE','QINGZHUAN_RELEASE_STORE_PASSWORD','QINGZHUAN_RELEASE_KEY_ALIAS','QINGZHUAN_RELEASE_KEY_PASSWORD'].every { System.getenv(it) }
android {
 namespace 'cn.qingzhuan.app'
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig { applicationId 'cn.qingzhuan.toolbox'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.5.4' }
 sourceSets { main { java.srcDirs += ['../../app/src/main/java']; java.exclude '**/QingzhuanModule.java','**/QingzhuanPackage.java'; res.srcDirs += ['../../app/src/main/res']; assets.srcDirs += ['../../native-assets'] } }
signingConfigs {
  debug { def testKey = file(System.getenv('QINGZHUAN_DEBUG_KEYSTORE') ?: '../../../private-signing/qingzhuan-preview.keystore'); if(testKey.exists()) storeFile testKey; storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
  if (productionSigningReady) {
   create('production') { storeFile file(System.getenv('QINGZHUAN_RELEASE_KEYSTORE')); storePassword System.getenv('QINGZHUAN_RELEASE_STORE_PASSWORD'); keyAlias System.getenv('QINGZHUAN_RELEASE_KEY_ALIAS'); keyPassword System.getenv('QINGZHUAN_RELEASE_KEY_PASSWORD') }
  }
 }
 buildTypes { debug { signingConfig signingConfigs.debug }; release { if (productionSigningReady) signingConfig signingConfigs.production; minifyEnabled false } }
 testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"; maxHeapSize = "1536m"; if(System.getenv("QZ_TEST_JAVA")) executable = System.getenv("QZ_TEST_JAVA") } }
 buildFeatures { compose true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] } }
}
dependencies {
 implementation 'com.squareup:gifencoder:0.10.1'
 implementation 'androidx.media3:media3-transformer:1.11.1'
 implementation 'androidx.media3:media3-effect:1.11.1'
 implementation 'androidx.media3:media3-ui:1.11.1'
 implementation 'androidx.activity:activity-compose:1.12.4'
 implementation 'androidx.core:core-ktx:1.17.0'
 implementation 'androidx.compose.ui:ui:1.10.3'
 implementation 'androidx.compose.foundation:foundation:1.10.3'
 implementation 'androidx.compose.material3:material3:1.4.0'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
 implementation 'io.github.kyant0:backdrop:1.0.6'
 implementation fileTree(dir:'../../libs',include:['*.jar'])
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.16.1'
 testImplementation 'androidx.compose.ui:ui-test-junit4:1.10.3'
 debugImplementation 'androidx.compose.ui:ui-test-manifest:1.10.3'
}

gradle.taskGraph.whenReady { graph ->
 if (graph.allTasks.any { it.name in ['assembleRelease','packageRelease','bundleRelease'] } && !productionSigningReady) {
  throw new GradleException('A dedicated production signing key is required for release APK/AAB builds; debug signing is not allowed.')
 }
}
